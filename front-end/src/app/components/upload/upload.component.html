<div class="upload-container">
  <div class="upload-header">
    <h3>Data Ingestion</h3>
    <p>Upload PDF, Word, Excel, or CSV to train the AI</p>
  </div>
  
  <div class="upload-area">
    <input type="file" id="file" (change)="onFileSelected($event)" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv" [disabled]="uploading" class="file-input">
    <label for="file" class="file-label" [class.uploading]="uploading">
      <div class="icon">
        <svg *ngIf="!uploading" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <svg *ngIf="uploading" class="spinner" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
      </div>
      <span>{{ uploading ? 'Processing Document...' : 'Choose a file or drag it here' }}</span>
    </label>
  </div>

  <div *ngIf="message" class="status-message" [class.success]="isSuccess" [class.error]="!isSuccess && !uploading">
    {{ message }}
  </div>
</div>
