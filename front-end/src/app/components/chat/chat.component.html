<div class="chat-container">
  <div class="chat-header">
    <div class="avatar">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path><path d="M9 14h6"></path><path d="M12 11v6"></path></svg>
    </div>
    <div class="header-info">
      <h3>Medical Assistant AI</h3>
      <span class="status"><span class="dot"></span> Online</span>
    </div>
  </div>

  <div class="chat-messages" #chatScroll>
    <div class="message-wrapper" *ngFor="let msg of messages" [class.is-user]="msg.sender === 'user'">
      <div class="message-bubble">
        {{ msg.text }}
      </div>
    </div>
    
    <div class="message-wrapper" *ngIf="loading">
      <div class="message-bubble typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <div class="chat-input-area">
    <div class="input-group">
      <input type="text" [(ngModel)]="symptoms" (keyup.enter)="sendMessage()" placeholder="ระบุอาการที่พบ (เช่น ปวดหัว มีไข้)..." [disabled]="loading" class="main-input">
      <input type="text" [(ngModel)]="allergies" (keyup.enter)="sendMessage()" placeholder="ประวัติแพ้ยา (ถ้ามี)..." [disabled]="loading" class="sub-input">
    </div>
    <button (click)="sendMessage()" [disabled]="!symptoms.trim() || loading" class="send-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</div>
